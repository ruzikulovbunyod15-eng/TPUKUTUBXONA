{% extends "library/base.html" %}

{% block title %}Kitobni o‘chirish - TPU{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#f4f7fe] p-6">
    <div class="max-w-md w-full rounded-[30px] p-10 bg-white shadow-xl shadow-blue-100/50 border border-slate-50 text-center">
        
        <div class="w-24 h-24 bg-red-50 text-red-500 rounded-full flex items-center justify-center text-5xl mx-auto mb-8 animate-pulse">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </div>
        
        <h2 class="text-2xl font-bold text-[#1B2559] mb-4">Kitobni o‘chirish</h2>
        <p class="text-[#A3AED0] mb-8 leading-relaxed">
            Siz haqiqatan ham <span class="font-bold text-red-600">"{{ book.title }}"</span> kitobini tizimdan butunlay o‘chirmoqchimisiz?
        </p>

        <form method="post" class="flex flex-col gap-3">
            {% csrf_token %}
            <button type="submit" class="w-full py-4 bg-red-500 text-white rounded-2xl font-bold text-lg hover:bg-red-600 transition-all shadow-lg shadow-red-100 active:scale-[0.98]">
                Ha, o‘chirilsin
            </button>
            
            <a href="{% url 'books_list' %}" class="w-full py-4 bg-[#F4F7FE] text-[#1B2559] rounded-2xl font-bold text-lg hover:bg-slate-200 transition-all text-center">
                Bekor qilish
            </a>
        </form>
    </div>
</div>

<style>
    /* 1-rasmdagi "Smart" shriftiga o'xshash shrift ulaymiz */
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
    
    body {
        font-family: 'DM Sans', sans-serif;
    }
</style>
{% endblock %}
